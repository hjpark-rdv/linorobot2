# ekf.yaml: LIO-SAM Odometry를 주 입력으로 사용하여 슬립에 강한 odom -> base_link TF 생성

ekf_filter_node:
  ros__parameters:
    # --- 기본 설정 ---
    frequency: 50.0            # LIO-SAM의 발행 주파수가 높으므로 EKF도 높게 설정
    sensor_timeout: 0.1
    two_d_mode: true
    print_diagnostics: true

    # --- 좌표계(Frame) 설정 ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint # 사용자의 로봇 모델에 맞게 base_link 또는 base_footprint
    world_frame: odom          # EKF는 odom -> base_link 생성에만 집중

    # --- 센서 입력 0: LIO-SAM Odometry (★★★★★ 가장 중요한 입력) ---
    # LIO-SAM이 발행하는 최종 오도메트리 토픽
    odom0: /lio_sam/mapping/odometry
    odom0_config:
    # [X,  Y,  Z,      Roll, Pitch, Yaw,     Vx,  Vy,  Vz,      Vroll, Vpitch, Vyaw]
    #  LIO-SAM의 모든 위치, 각도, 속도 정보를 신뢰하고 사용합니다.
      [true, true, true,   true,  true,  true,    true, true, true,   true,  true,  true]
    odom0_differential: false
    odom0_queue_size: 10
    
    # --- 센서 입력 1: IMU ---
    # odom0 (LIO-SAM)에 이미 IMU 데이터가 완벽하게 융합되어 있으므로,
    # 동일한 IMU를 EKF에 중복으로 입력하지 않는 것이 더 안정적일 수 있습니다.
    # 만약 더 부드러운 회전 예측이 필요하다면 아래 주석을 해제하여 IMU를 추가할 수 있습니다.
    # imu0: /imu/data
    # imu0_config:
    # # 각속도만 사용하여 회전 움직임을 보강합니다. (가속도와 각도는 odom0에서 이미 사용)
    #   [false, false, false,   false, false, false,
    #    false, false, false,   true,  true,  true,
    #    false]
    # imu0_differential: false
    # imu0_remove_gravitational_acceleration: true
    # imu0_queue_size: 10