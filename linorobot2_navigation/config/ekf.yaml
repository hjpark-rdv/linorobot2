# ekf.yaml: robot_localization EKF and NavSat transform configuration

# EKF 필터 노드: LIO-SAM Odometry와 GPS Odometry를 융합하여 'map' -> 'odom' TF를 생성
ekf_filter_node:
    ros__parameters:
        # 필터의 업데이트 주기 (Hz)
        frequency: 30.0

        # 센서 데이터가 이 시간(초) 동안 들어오지 않으면 타임아웃 처리
        sensor_timeout: 0.1

        # 2D 평면에서만 주행하는 경우 true. 고도를 무시하여 안정성을 높임.
        two_d_mode: true

        # TF 변환에 적용할 시간 오프셋 (초)
        transform_time_offset: 0.0

        # 진단 메시지 출력 여부
        print_diagnostics: true

        # --- 기본 좌표계(Frame) 설정 ---
        # EKF가 최종적으로 발행할 전역 지도 좌표계
        map_frame: map
        # Odometry의 기준 좌표계 (LIO-SAM이 발행하는 프레임)
        odom_frame: odom
        # 로봇의 기준 좌표계
        base_link_frame: base_link
        # 월드(전역) 좌표계. 일반적으로 map_frame과 동일하게 설정.
        world_frame: odom

        # --- 센서 입력 설정: LIO-SAM Odometry ---
        odom0: /lio_sam/mapping/odometry
        # odom0: /Odometry
        odom0_config:
        # [X, Y, Z, Roll, Pitch, Yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw]
        # X, Y 위치, Yaw 각도, X, Y 선속도, Yaw 각속도를 사용
          [true,  true,  false,
           false, false, true,
           true,  true,  false,
           false, false, true]
        odom0_differential: false # false: 절대 위치, true: 이전 측정치 대비 변화량
        odom0_relative: false     # true: 첫 측정치 기준 상대 위치. SLAM/GPS는 절대 위치이므로 false

        # --- 센서 입력 설정: GPS ---
        # navsat_transform_node가 GPS(NavSatFix)를 변환하여 발행하는 odometry 토픽
        odom1: /odometry/gps
        odom1_config:
        # X, Y 위치만 사용. GPS는 각도/속도 정보의 신뢰도가 낮으므로 사용하지 않음
          [true,  true,  false,
           false, false, false,
           false, false, false,
           false, false, false]
        odom1_differential: false
        odom1_relative: false
        odom1_queue_size: 10


# NavSat Transform 노드: GPS(위도/경도)를 'map' 좌표계의 X, Y 값으로 변환
navsat_transform_node:
    ros__parameters:
        # GPS 데이터 변환 주기 (Hz)
        frequency: 30.0

        # EKF가 안정화될 때까지 기다리는 시간 (초)
        delay: 3.0

        # 자기 편각 (라디안). 지역에 따라 설정. (서울 기준 약 -0.156 rad)
        # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml 에서 확인
        magnetic_declination_radians: -0.156

        # IMU의 Yaw 오프셋 (라디안). 로봇의 전방(base_link x축)과 IMU의 0도가 일치하지 않을 때 설정.
        # 기본값은 1.570796327 (동쪽이 0)
        yaw_offset: 1.570796327

        # GPS의 첫 수신 위치를 지도 원점(0,0,0)으로 사용할지 여부
        zero_altitude: true

        # 변환된 GPS 위치(/odometry/gps)를 발행할지 여부
        publish_filtered_gps: true

        # EKF의 Odometry에서 Yaw 값을 사용할지 여부 (IMU가 없는 경우 사용)
        use_odometry_yaw: false

        # GPS 원점(datum)이 명시적으로 설정될 때까지 기다릴지 여부
        wait_for_datum: false

        # 입력 토픽 이름
        # EKF의 최종 결과물(map->odom)을 입력받아 GPS 변환의 기준을 잡음
        odom_topic: /odometry/filtered
        # GPS 수신기에서 발행하는 토픽
        gps_topic: /gps/fix
        # IMU 데이터 토픽 (자기 편각 보정에 사용)
        imu_topic: /imu/data